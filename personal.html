<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly Navbar</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="common.css">
</head>
<body>

    <header class="header" id="header">
        <nav class="navbar">
            <!-- Logo Section -->
            <a href="#" class="logo">
                <img src="./asset/Stackly-logo-Blue.webp" alt="logo">
            </a>

            <!-- Navigation Links & Actions wrapper -->
            <div class="nav-menu" id="navMenu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#" class="active">Personal</a></li>
                    <li><a href="#">Business</a></li>
                    <li><a href="#">Wealth</a></li>
                    <li><a href="#">Loans&Cards</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Help</a></li>
                </ul>

                <!-- Actions (Search & Login) -->
                <div class="nav-actions">
                    <div class="search-container">
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="Search">
                            <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                        </div>
                        <!-- Error Message -->
                        <span class="search-error" id="searchError">Please enter a keyword to search</span>
                    </div>
                    <a href="#" class="login-btn">Login</a>
                </div>
            </div>

            <!-- Mobile Menu Toggle -->
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>
    </header>

    <!-- Dummy content to test scroll effect -->
    <section style="height: 200vh; padding: 120px 20px; background-color: #F8F9FA;">
        <!-- <h1>Scroll down to see the navbar animation!</h1> -->
        <!-- <p>Responsive corporate layout optimized for all screens.</p> -->
    </section>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
